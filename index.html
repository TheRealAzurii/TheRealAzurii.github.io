<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Click me</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 id="t" aria-hidden="true"></h1>
  <div class="sr" id="sr" role="status" aria-live="polite"></div>

  <div id="term">
    <div class="row">
      <span aria-hidden="true"><span id="prompt"></span><span id="b"></span><span class="cur" id="c"></span><span id="a"></span></span>
      <input id="in" type="text" maxlength="240" disabled autocomplete="off" autocapitalize="off"
             autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Type your message and press Enter">
    </div>
  </div>

<script src="config.js" defer></script>
<script src="audio.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
